    <main class="site-shell">
      <section class="cinema-scroll" id="top" data-i18n-attr="aria-label:cinema.label">
        <div class="stage">
          <div class="world">
            <!-- Videobühne. Die Box nimmt für jeden Abschnitt Format, Maßstab
                 und Versatz an (CLIP_FIT in script.js), denn die vier Clips
                 sind auf verschiedene Ausschnitte gerendert. Dadurch steht das
                 Buch über den Schnitt hinweg unverrückt an derselben Stelle;
                 was sich ändert, ist nur der weiße Rand ringsum. -->
            <div class="film" aria-hidden="true">
              <video
                class="film-video film-video-loop"
                src="assets/video/loop.mp4"
                autoplay
                loop
                muted
                playsinline
                preload="auto"
              ></video>
              <!-- Die vier Abschnitte liegen übereinander; sichtbar ist immer
                   nur der, in dem die Scrollposition gerade steht. Die
                   Schnittbilder sind deckungsgleich, der Wechsel fällt
                   deshalb nicht auf. -->
              <video class="film-video film-video-clip" src="assets/video/step1.mp4" muted playsinline preload="auto"></video>
              <video class="film-video film-video-clip" src="assets/video/step2.mp4" muted playsinline preload="auto"></video>
              <video class="film-video film-video-clip" src="assets/video/step3.mp4" muted playsinline preload="auto"></video>
              <video class="film-video film-video-clip" src="assets/video/step4.mp4" muted playsinline preload="auto"></video>
            </div>

            <!-- Standbild des Schlussmoments (letztes Bild von step4,
                 doppelt aufgelöst). Beginnt exakt auf dem Videoausschnitt und
                 öffnet sich dann auf die ganze Bühne. -->
            <div class="reveal" aria-hidden="true">
              <img class="reveal-img" src="assets/video/step4_end.jpg" alt="" decoding="async" />
            </div>

            <!-- Auswahl auf dem Buchdeckel. Nur während des Halts sichtbar,
                 Lage per Homographie auf das ausgemessene Lederfeld gerechnet
                 (siehe script.js). Die Prägung hat zwei Zustände: das Zeichen
                 von Yazardan Direkt und ein leeres Feld für das eigene. Leder
                 und Metall sind frei wählbar -- die Farben stehen als
                 COVER_LEATHERS und COVER_FOILS in script.js. -->
            <section class="cover-pick" data-i18n-attr="aria-label:cover.label">
              <!-- Färbt das Lederfeld ein. Liegt unter dem Logo und mischt
                   sich farbig mit dem Video, damit die Lederstruktur
                   durchscheint. Bei Siyah ruht die Schicht (Stärke 0). -->
              <div class="cover-tint cover-tint-front" aria-hidden="true"></div>
              <div class="cover-tint cover-tint-spine" aria-hidden="true"></div>
              <div class="cover-logo"><span class="cover-logo-text"></span></div>
              <!-- Dasselbe Logo noch einmal quer auf dem Buchrücken. -->
              <div class="cover-logo cover-logo-spine"><span class="cover-logo-text"></span></div>
              <button
                class="cover-arrow cover-arrow-prev"
                type="button"
                data-i18n-attr="aria-label:cover.prev"
              >
                ‹
              </button>
              <button
                class="cover-arrow cover-arrow-next"
                type="button"
                data-i18n-attr="aria-label:cover.next"
              >
                ›
              </button>

              <div class="cover-panel">
                <p class="cover-label" aria-live="polite"></p>
                <div class="cover-dots" aria-hidden="true"></div>
                <div class="cover-groups">
                  <div class="cover-group">
                    <span class="cover-group-label" data-i18n="cover.group.leather"></span>
                    <div
                      class="cover-swatches cover-swatches-leather"
                      role="group"
                      data-i18n-attr="aria-label:cover.group.leather"
                    ></div>
                  </div>
                  <div class="cover-group">
                    <span class="cover-group-label" data-i18n="cover.group.foil"></span>
                    <div
                      class="cover-swatches cover-swatches-foil"
                      role="group"
                      data-i18n-attr="aria-label:cover.group.foil"
                    ></div>
                  </div>
                </div>
              </div>
            </section>

            <!-- Markenviolett als Lichtstimmung. Liegt ÜBER dem Video und
                 deckt die ganze Bühne, damit Video- und Seitenschwarz gleich
                 eingefärbt werden -- sonst würde die Videokante wieder
                 sichtbar. -->
            <div class="bloom" aria-hidden="true"></div>
