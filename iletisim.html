    <main class="site-shell">
      <section class="page-head" id="top">
        <div class="wrap">
          <p class="kicker" data-i18n="head.contact.kicker"></p>
          <h1 data-i18n="head.contact.h1"></h1>
          <p class="lede" data-i18n="head.contact.lede"></p>
        </div>
      </section>

      <section class="band band-dark">
        <div class="wrap">
          <div class="contact">
            <dl class="contact-list contact-list-lead">
              <dt data-i18n="contact.phone.label"></dt>
              <dd><a href="tel:+902163011213">+90-0216-301-1213</a></dd>
              <dt data-i18n="contact.mail.label"></dt>
              <dd><a href="mailto:info@yazardandirekt.com">info@yazardandirekt.com</a></dd>
              <dt data-i18n="contact.hours.label"></dt>
              <dd data-i18n="contact.hours.value"></dd>
            </dl>

            <!-- Kein Server dahinter: script.js baut aus den Feldern einen
                 mailto-Link. Sobald ein Endpunkt steht, bekommt das Formular
                 action/method und der Zweig in script.js entfällt. -->
            <form class="contact-form" data-i18n-attr="aria-label:contact.form.label" novalidate>
              <input
                type="text"
                name="isim"
                autocomplete="name"
                required
                data-i18n-attr="placeholder:contact.form.name;aria-label:contact.form.name"
              />
              <input
                type="email"
                name="email"
                autocomplete="email"
                required
                data-i18n-attr="placeholder:contact.form.email;aria-label:contact.form.email"
              />
              <input
                type="tel"
                name="telefon"
                autocomplete="tel"
                data-i18n-attr="placeholder:contact.form.phone;aria-label:contact.form.phone"
              />
              <textarea
                name="mesaj"
                rows="4"
                data-i18n-attr="placeholder:contact.form.message;aria-label:contact.form.message"
              ></textarea>
              <button type="submit" data-i18n="contact.form.send"></button>
              <p class="note" data-i18n="contact.form.hint"></p>
            </form>
          </div>
        </div>
      </section>

      <section class="band" id="sss" aria-labelledby="faq-h">
        <div class="wrap">
          <div class="lede-grid">
            <div class="lede-grid-head">
              <p class="kicker" data-i18n="faq.kicker"></p>
              <h2 class="band-h" id="faq-h" data-i18n="faq.h2"></h2>
            </div>
            <!-- <details> statt eigener Mechanik: Auf- und Zuklappen,
                 Tastatur und Vorlesen kommen vom Browser. -->
            <div class="lede-grid-body faq">
              <details>
                <summary data-i18n="faq.1.q"></summary>
                <p data-i18n="faq.1.a"></p>
              </details>
              <details>
                <summary data-i18n="faq.2.q"></summary>
                <p data-i18n="faq.2.a"></p>
              </details>
              <details>
                <summary data-i18n="faq.3.q"></summary>
                <p data-i18n="faq.3.a"></p>
              </details>
              <details>
                <summary data-i18n="faq.4.q"></summary>
                <p data-i18n="faq.4.a"></p>
              </details>
              <details>
                <summary data-i18n="faq.5.q"></summary>
                <p data-i18n="faq.5.a"></p>
              </details>
              <details>
                <summary data-i18n="faq.6.q"></summary>
                <p data-i18n="faq.6.a"></p>
              </details>
              <details>
                <summary data-i18n="faq.7.q"></summary>
                <p data-i18n="faq.7.a"></p>
              </details>
              <details>
                <summary data-i18n="faq.8.q"></summary>
                <p data-i18n="faq.8.a"></p>
              </details>
            </div>
          </div>
